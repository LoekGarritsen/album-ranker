services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: album-ranker-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8200}:8400"
    env_file: [.env]
    environment:
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-https://albums.garritsen.dev/api/spotify/callback}
      - FRONTEND_URL=${FRONTEND_URL:-https://albums.garritsen.dev}
    volumes:
      - ./data:/app/data
    networks:
      - album-ranker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: album-ranker-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8201}:8401"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - album-ranker

networks:
  album-ranker:
    driver: bridge
